<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR 基础信息报告 - 详情</title>
  <script>
    (function () {
      var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || "";
      document.documentElement.classList.toggle("is-windows", /Win/i.test(platform));
    })();
  </script>
  <style>
    @font-face {
      font-family: "OCRSansSC";
      src: url("assets/fonts/SourceHanSansSC-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #F8F6F0;
      --bg-soft: #F3F0E8;
      --paper: #FFFDF8;
      --paper-strong: #FFFFFF;
      --line: #E6E0D4;
      --line-soft: #EEE8DC;
      --text: #2F2A24;
      --muted: #7B746A;
      --soft: #A9A196;
      --primary: #7F9D8C;
      --primary-hover: #6F8E7E;
      --primary-soft: #E7F0EA;
      --ok: #4F7A5F;
      --bad: #B46458;
      --warn: #9A7A3F;
      --success-bg: #E8F3EC;
      --success-border: #CFE3D6;
      --warning-bg: #F9F0D8;
      --warning-border: #EEDCA8;
      --danger-bg: #F8E7E3;
      --danger-border: #EAC8C1;
      --shadow: 0 12px 32px rgba(47, 42, 36, .055);
      --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "Hiragino Sans GB", sans-serif;
      --font-windows-display: "OCRSansSC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --font-windows-data: "Microsoft YaHei UI", "Microsoft YaHei", "OCRSansSC", "Noto Sans CJK SC", sans-serif;
    }

    * { box-sizing: border-box; }

    html.is-windows body {
      font-family: var(--font-windows-data);
      text-rendering: optimizeLegibility;
    }

    html.is-windows h1,
    html.is-windows .section-label,
    html.is-windows .employment-title,
    html.is-windows .employment-subtitle,
    html.is-windows .status-main {
      font-family: var(--font-windows-data);
      letter-spacing: 0;
    }

    html.is-windows table,
    html.is-windows input,
    html.is-windows select,
    html.is-windows button {
      font-family: var(--font-windows-data);
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 7% 2%, rgba(221, 235, 226, .72), transparent 270px),
        radial-gradient(circle at 96% 0%, rgba(216, 185, 154, .18), transparent 320px),
        linear-gradient(180deg, rgba(255,253,248,.78), rgba(248,246,240,.98)),
        var(--bg);
      font-family: var(--font-ui);
      font-variant-numeric: tabular-nums;
      line-height: 1.55;
    }

    .container {
      width: min(1440px, calc(100vw - 36px));
      margin: 0 auto;
      padding: 22px 0 40px;
    }

    .detail-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
    }

    .detail-head h1 {
      margin: 0;
      color: var(--text);
      font-size: 24px;
      font-weight: 560;
      line-height: 1.25;
      letter-spacing: -.2px;
    }

    .detail-subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .detail-nav,
    .detail-actions,
    .toolbar-actions,
    .pager {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .detail-nav { justify-content: flex-end; }

    .btn,
    .nav-btn-mini,
    button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: #5F574E;
      padding: 6px 11px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      line-height: 1.35;
      text-decoration: none;
      transition: background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
    }

    .btn:hover,
    .nav-btn-mini:hover,
    button:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--text);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    #reviewBtn {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: #537264;
      font-weight: 650;
    }

    #reviewBtn.reviewed {
      border-color: var(--success-border);
      background: var(--success-bg);
      color: var(--ok);
    }

    #rejectReviewBtn.reviewed {
      border-color: var(--danger-border);
      background: var(--danger-bg);
      color: var(--bad);
      font-weight: 650;
    }

    .detail-actionbar {
      position: sticky;
      top: 8px;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding: 9px 11px;
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      background: rgba(255,253,248,.86);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 22px rgba(47, 42, 36, .035);
    }

    .detail-context {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    #fileTitle {
      max-width: min(520px, 44vw);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .small,
    .muted,
    .employment-muted,
    .employment-source {
      color: var(--muted);
      font-size: 12px;
    }

    .chip,
    .badge {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      padding: 3px 8px;
      font-size: 12px;
      line-height: 1.35;
      white-space: nowrap;
    }

    #reviewStatus {
      border-color: var(--line);
      background: var(--paper);
      color: var(--muted);
      font-weight: 650;
    }

    #reviewStatus.status-ok {
      border-color: var(--success-border);
      background: var(--success-bg);
      color: var(--ok);
    }

    #reviewStatus.status-warn {
      border-color: var(--warning-border);
      background: var(--warning-bg);
      color: var(--warn);
    }

    #reviewStatus.status-bad {
      border-color: var(--danger-border);
      background: var(--danger-bg);
      color: var(--bad);
    }

    .card,
    .debug-panel,
    .employment-subcard {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,253,248,.88);
      box-shadow: var(--shadow);
    }

    .review-workbench {
      --detail-pane-height: clamp(560px, calc(56vh + 92px), 680px);
      display: grid;
      grid-template-columns: minmax(0, 1.04fr) minmax(360px, 520px);
      gap: 16px;
      align-items: stretch;
    }

    .structured-review {
      display: grid;
      grid-template-rows: auto 68px 186px 78px minmax(0, 1fr);
      gap: 10px;
      height: var(--detail-pane-height);
      min-width: 0;
      min-height: 0;
      padding: 14px;
      overflow: hidden;
    }

    .evidence-head,
    .employment-head,
    .employment-subhead,
    .image-title,
    .method-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .evidence-head h2,
    .image-title h2,
    .card h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 620;
      color: var(--text);
    }

    .section-label,
    .employment-title,
    .employment-subtitle {
      color: var(--muted);
      font-size: 12px;
      font-weight: 680;
      letter-spacing: .02em;
    }

    .review-section {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      min-width: 0;
      min-height: 0;
      padding: 10px;
      border: 1px solid var(--line-soft);
      border-radius: 13px;
      background: rgba(255,253,248,.70);
      overflow: hidden;
    }

    .status-strip {
      display: grid;
      gap: 8px;
      padding: 11px 12px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      background: rgba(255,253,248,.72);
    }

    .structured-review .status-strip {
      height: 68px;
      min-height: 0;
      overflow: auto;
    }

    .status-strip.ok {
      border-color: var(--success-border);
      background: rgba(232,243,236,.62);
    }

    .status-strip.pending {
      border-color: var(--warning-border);
      background: rgba(249,240,216,.62);
    }

    .status-strip.failed {
      border-color: var(--danger-border);
      background: rgba(248,231,227,.64);
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status-main {
      color: var(--text);
      font-size: 15px;
      font-weight: 680;
    }

    .status-strip.ok .status-main { color: var(--ok); }
    .status-strip.pending .status-main { color: var(--warn); }
    .status-strip.failed .status-main { color: var(--bad); }

    .focus-reasons {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .focus-empty {
      color: var(--muted);
      font-size: 13px;
    }

    .focus-reason,
    .focus-metric,
    .employment-pill,
    .field-state {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--warning-border);
      border-radius: 999px;
      background: var(--warning-bg);
      color: var(--warning-text);
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 560;
      line-height: 1.35;
      white-space: nowrap;
    }

    .focus-reason.bad,
    .employment-pill.bad,
    .field-state.bad {
      border-color: var(--danger-border);
      background: var(--danger-bg);
      color: var(--bad);
    }

    .focus-metric,
    .employment-pill.ok,
    .field-state.ok {
      border-color: var(--success-border);
      background: var(--success-bg);
      color: var(--ok);
    }

    .focus-metric.warn,
    .employment-pill.warn,
    .field-state.warn {
      border-color: var(--warning-border);
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .employment-pill.muted,
    .field-state {
      border-color: var(--line-soft);
      background: #FFFCF5;
      color: var(--muted);
    }

    .base-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: minmax(42px, auto);
      gap: 8px;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .focus-field,
    .base-field {
      min-width: 0;
      padding: 8px 9px;
      border: 1px solid var(--line-soft);
      border-radius: 11px;
      background: rgba(255,253,248,.88);
    }

    .focus-field .k,
    .base-field .k {
      margin-bottom: 4px;
      color: var(--soft);
      font-size: 11px;
    }

    .focus-field .v,
    .base-field .v {
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.4;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .enterprise-overview-line,
    #enterpriseOverviewLine,
    .focus-employment {
      width: 100%;
      min-width: 0;
      min-height: 0;
    }

    .focus-employment-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      width: 100%;
      min-width: 0;
    }

    .focus-metric {
      width: 100%;
      min-width: 0;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 9px;
    }

    .focus-metric .metric-name,
    .focus-metric .metric-value {
      min-width: 0;
      white-space: nowrap;
    }

    .focus-metric .metric-value {
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }

    #enterpriseOverviewLine {
      display: grid;
      align-items: center;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      overflow: hidden;
    }

    #enterpriseOverviewLine .focus-empty {
      display: flex;
      align-items: center;
      height: 100%;
      min-height: 28px;
    }

    .employment-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      min-width: 0;
      min-height: 0;
      margin-top: 0;
      padding: 10px;
      border: 1px solid var(--line-soft);
      border-radius: 13px;
      background: rgba(255,253,248,.70);
      overflow: hidden;
      box-sizing: border-box;
    }

    .employment-head,
    .employment-subhead {
      margin: 0;
      padding: 0;
      background: transparent;
      border: 0;
    }

    .employment-count {
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      background: #FFFCF5;
      color: var(--muted);
      padding: 2px 8px;
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .employment-head-meta,
    .employment-legend {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .employment-legend {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--muted);
      box-shadow: 0 0 0 2px rgba(255,253,248,.9);
    }

    .legend-dot.ok { background: var(--ok); }
    .legend-dot.bad { background: var(--bad); }
    .legend-dot.warn { background: var(--warn); }
    .legend-dot.muted { background: var(--soft); }

    .employment-subcard {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
      overflow: hidden;
      border-color: var(--line-soft);
      border-radius: 12px;
      box-shadow: none;
      background: rgba(255,253,248,.82);
    }

    .employment-table-wrap {
      max-height: none;
      min-height: 0;
      height: 100%;
      overflow: auto;
      border-top: 1px solid var(--line-soft);
      background: #FFFCF5;
    }

    .employment-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    .employment-table th,
    .employment-table td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: top;
      text-align: left;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .employment-table th:nth-child(1),
    .employment-table td:nth-child(1) { width: 34px; }
    .employment-table th:nth-child(2),
    .employment-table td:nth-child(2) { width: 30%; }
    .employment-table th:nth-child(3),
    .employment-table td:nth-child(3) { width: 13%; }
    .employment-table th:nth-child(4),
    .employment-table td:nth-child(4) { width: 29%; }
    .employment-table th:nth-child(5),
    .employment-table td:nth-child(5) { width: 9%; }
    .employment-table th:nth-child(6),
    .employment-table td:nth-child(6) { width: 86px; }

    .employment-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #F3F0E8;
      color: var(--muted);
      font-weight: 650;
      white-space: nowrap;
    }

    .employment-table th:nth-child(1),
    .employment-table td:nth-child(1) { width: 42px; }
    .employment-table th:nth-child(2),
    .employment-table td:nth-child(2) { width: 34%; }
    .employment-table th:nth-child(3),
    .employment-table td:nth-child(3) { width: 16%; }
    .employment-table th:nth-child(4),
    .employment-table td:nth-child(4) { width: 18%; }
    .employment-table th:nth-child(5),
    .employment-table td:nth-child(5) { width: 12%; }
    .employment-table th:nth-child(6),
    .employment-table td:nth-child(6) { width: 92px; }

    .employment-table tbody tr:nth-child(even) {
      background: rgba(248,246,240,.42);
    }

    .employment-table tbody tr:hover {
      background: rgba(231,240,234,.52);
    }

    .employment-company,
    .employment-placeholder {
      display: block;
      color: var(--text);
      font-weight: 650;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .employment-placeholder { color: var(--warn); }

    .employment-source {
      display: block;
      margin-top: 3px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }

    .employment-table td:nth-child(4) {
      color: var(--muted);
      line-height: 1.45;
    }

    .employment-table td:nth-child(5) {
      color: var(--text);
      font-weight: 680;
      font-variant-numeric: tabular-nums;
    }

    .employment-status-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-width: 0;
    }

    .field-state {
      min-width: 22px;
      justify-content: center;
      padding: 1px 5px;
      font-size: 10px;
      line-height: 17px;
    }

    .employment-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      height: 100%;
      border: 1px dashed var(--line-soft);
      border-radius: 12px;
      background: rgba(255,252,245,.82);
      color: var(--muted);
      font-size: 13px;
    }

    .image-pane {
      position: sticky;
      top: 76px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
      height: var(--detail-pane-height);
      min-height: 0;
      padding: 12px;
      overflow: hidden;
    }

    .image-title {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .image-title h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 620;
    }

    .photo-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .photo-counter {
      justify-self: end;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      background: #FFFCF5;
      color: var(--muted);
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    .image-hint { display: none; }

    .img-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: auto;
      min-height: 0;
      overflow: hidden;
      padding: 7px;
      border-radius: 14px;
      background: #F5F2EA;
      box-shadow: inset 0 0 0 1px rgba(230,224,212,.58);
      cursor: zoom-in;
    }

    .img-wrap img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 12px;
      object-fit: contain;
    }

    .img-wrap.expanded {
      height: min(78vh, 760px);
      min-height: 540px;
      overflow-y: auto;
      overflow-x: hidden;
      align-items: flex-start;
      cursor: zoom-out;
    }

    .img-wrap.expanded img {
      max-width: 100%;
      max-height: none;
    }

    .photo-nav {
      position: absolute;
      top: 50%;
      z-index: 4;
      display: none;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 46px;
      transform: translateY(-50%);
      border: 1px solid rgba(230,224,212,.82);
      border-radius: 999px;
      background: rgba(255,253,248,.88);
      color: var(--text);
      box-shadow: 0 8px 20px rgba(62,54,43,.10);
      font-size: 22px;
      line-height: 1;
    }

    .photo-nav.show { display: inline-flex; }
    .photo-nav.prev { left: 12px; }
    .photo-nav.next { right: 12px; }

    #rawPath {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .debug-panel {
      margin-top: 18px;
      overflow: hidden;
      box-shadow: none;
      border-style: dashed;
      background: rgba(255,253,248,.64);
    }

    .debug-panel .evidence-head h2 {
      color: var(--muted);
      font-size: 14px;
      font-weight: 620;
    }

    .debug-panel .cards {
      grid-template-columns: repeat(4, minmax(260px, 1fr));
      gap: 12px;
      overflow-x: auto;
    }

    .debug-panel .card {
      padding: 10px;
      border-radius: 14px;
      box-shadow: none;
      background: rgba(255,253,248,.74);
    }

    .debug-panel .method-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 680;
    }

    .debug-panel pre,
    .debug-panel .raw-text,
    .debug-panel .ocr-raw {
      max-height: 260px;
      overflow: auto;
    }

    .debug-panel > summary {
      cursor: pointer;
      list-style: none;
      padding: 12px 14px;
      color: var(--muted);
      background: transparent;
      border-bottom: 0;
      font-size: 13px;
      font-weight: 650;
    }

    .debug-panel > summary::-webkit-details-marker { display: none; }
    .debug-panel > summary::after { content: "展开"; float: right; color: var(--soft); }
    .debug-panel[open] > summary::after { content: "收起"; }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 12px;
    }

    .method-block .card,
    #methodCards .card {
      box-shadow: none;
      border-color: var(--line-soft);
      border-radius: 14px;
      padding: 12px;
      background: #FFFCF5;
    }

    .method-title {
      margin-bottom: 8px;
      display: grid;
      grid-template-rows: 20px 34px;
      gap: 5px;
      min-height: 59px;
      align-items: start;
    }

    .method-title .name {
      color: var(--text);
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .method-exec-result {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 7px;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;

    .method-exec-result .k {
      color: var(--soft);
      white-space: nowrap;
    }

    .method-exec-result .v {
      min-width: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .field-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      min-height: 44px;
      margin: 0;
      padding: 5px 0;
      border-bottom: 1px solid var(--line-soft);
      font-size: 13px;
    }

    .method-fields {
      display: grid;
      grid-template-rows: repeat(7, 44px);
      margin-top: 8px;
      border-top: 1px solid var(--line-soft);
    }

    .field-row .k,
    .kv .k {
      color: var(--muted);
    }

    .field-row .v,
    .kv .v {
      min-width: 0;
      color: var(--text);
      font-weight: 560;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .field-row .small {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--soft);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    pre,
    .raw-lines {
      max-height: 260px;
      overflow: auto;
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      background: #FFFCF5;
      padding: 8px;
      color: var(--text);
      font-size: 12px;
      white-space: pre-wrap;

    .raw-lines { padding: 0; }
    .raw-lines table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .raw-lines th,
    .raw-lines td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
    .raw-lines th { position: sticky; top: 0; background: #F3F0E8; color: var(--muted); }
    .raw-lines .conf { white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .method-employment {
      margin-top: 8px;
    }

    .method-employment-title {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .method-employment-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1px solid var(--line-soft);

    .method-employment-table th,

      padding: 5px 6px;

    .method-employment-table th:nth-child(1),
    .method-employment-table td:nth-child(1) { width: 24px; }
    .method-employment-table th:nth-child(3),
    .method-employment-table td:nth-child(3) { width: 46px; }
    .method-employment-table th:nth-child(5),
    .method-employment-table td:nth-child(5) { width: 38px; }

    .method-employment-empty {
      padding: 8px;
      border: 1px dashed var(--line-soft);
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255,252,245,.72);

    .status-ok { color: var(--ok); font-weight: 650; }
    .status-warn { color: var(--warn); font-weight: 650; }

    #notFound { margin-top: 12px; }

    @media (max-width: 1100px) {

      .structured-review,
      .image-pane { height: auto; min-height: 0; }

    @media (max-width: 760px) {
      .container { width: min(100vw - 24px, 1440px); padding-top: 14px; }
      .detail-head,
      .detail-actionbar { grid-template-columns: 1fr; display: grid; align-items: start; }
      .detail-nav,
      .detail-actions { justify-content: flex-start; }
      #fileTitle { max-width: 100%; }
      .base-grid { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .employment-table { min-width: 760px; }
      .detail-head h1 { font-size: 20px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="detail-head">
      <div>
        <h1>OCR 基础信息结构化结果（详情）</h1>
        <div class="detail-subtitle">查看原图、共识字段、四路 OCR 结果与任职明细。</div>
      </div>
      <div class="detail-nav">
        <a class="btn nav-btn-mini" href="index.html">返回列表</a>
        <a class="btn nav-btn-mini" href="/">返回处理台</a>

    <div class="detail-actionbar">
      <div class="detail-context">

    <div id="detailBody" style="display:none;">
      <div class="review-workbench">
        <div class="card structured-review">
          <div class="evidence-head">
            <h2>结构化审阅</h2>
            <span class="small" id="reviewAnchor">基础信息 / 企业明细</span>
          </div>
          <div id="reviewStatusPanel" class="status-strip"></div>
          <div class="review-section">
            <div class="section-label">基础信息</div>
            <div class="base-grid" id="consensus"></div>
          </div>
          <div class="review-section enterprise-section">
            <div class="section-label">企业概览</div>
            <div class="enterprise-overview-line" id="enterpriseOverviewLine"></div>
          </div>
          <div id="employmentBlock" class="employment-panel"></div>
