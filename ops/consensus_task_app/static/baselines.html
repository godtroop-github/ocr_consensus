    function employmentCompareKey(row, idx) {
      const key = row.company_key || "";
      const name = row.company_name || "";
      if (key && !key.includes("未识别企业") && !name.includes("未识别企业")) return `k:${key}`;
      return `p:${row.row_index || idx}`;
    }

    function companyKeysCompatible(left, right) {
      const a = String(left || "").replace(/\s+/g, "");
      const b = String(right || "").replace(/\s+/g, "");
      if (!a || !b || a.includes("未识别企业") || b.includes("未识别企业")) return false;
      if (a.includes(b) || b.includes(a)) return Math.min(a.length, b.length) >= 6;
      const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
      let best = 0;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          if (a[i - 1] === b[j - 1]) {
            matrix[i][j] = matrix[i - 1][j - 1] + 1;
            best = Math.max(best, matrix[i][j]);
          }
        }
      }
      return best / Math.max(a.length, b.length) >= 0.86;
    }

    function alignEmploymentRows(row) {
      const baselineRows = row.baseline_employment || [];
      const currentRows = row.current_employment || [];
      const used = new Set();
      const pairs = baselineRows.map((baseline, baselineIdx) => {
        let matchedIdx = currentRows.findIndex((current, idx) => {
          if (used.has(idx)) return false;
          return employmentCompareKey(baseline, baselineIdx) === employmentCompareKey(current, idx);
        });
        if (matchedIdx < 0) {
          matchedIdx = currentRows.findIndex((current, idx) => {
            if (used.has(idx)) return false;
            return companyKeysCompatible(baseline.company_key, current.company_key);
          });
        }
        if (matchedIdx >= 0) {
          used.add(matchedIdx);
          return { baseline, current: currentRows[matchedIdx] };
        }
        return { baseline, current: null };
      });
      currentRows.forEach((current, idx) => {
        if (!used.has(idx)) pairs.push({ baseline: null, current });
      });
      return pairs;
    }

    function rowCompareStatus(pair) {
      if (!pair.baseline) return ["新增", "bad"];
      if (!pair.current) return ["缺失", "bad"];
      const fields = ["company_name", "business_status", "role", "share_ratio"];
      return fields.some((key) => String(pair.baseline[key] || "") !== String(pair.current[key] || "")) ? ["变化", "changed"] : ["一致", "same"];
    }

    function companyTitle(row) {
      if (!row) return "—";
      return row.company_name || "未识别企业";
    }

    function companySub(row) {
      if (!row) return "";
      const parts = [row.business_status, row.role, row.share_ratio].filter(Boolean);
      return parts.join(" · ");
    }

    function renderCompanyFieldCompare(pair) {

              }).join("")}

    function renderEmploymentCompare(row) {
      if (row.match_status === "unmatched_new" || row.match_status === "unmatched_missing") {

                <tbody>
                  ${rows.map((item) => `

                      <td>${esc(item.business_status || "—")}</td>
                      <td>${esc(item.role || "—")}</td>

                const open = cls !== "same" ? "open" : "";
                return `
                  <details class="company-card" ${open}>
                    <summary class="company-summary">
                      <div class="company-pair">
                        <div class="company-name">${esc(companyTitle(pair.baseline))}<small>${esc(companySub(pair.baseline))}</small></div>
                        <div class="arrow">→</div>
                        <div class="company-name">${esc(companyTitle(pair.current))}<small>${esc(companySub(pair.current))}</small></div>

    }

    function compareDetailUrl(row, data, pos) {

    function skipCompareDecision(data, row) {
      const decisions = readCompareDecisions(data);
      const idx = String(row._compare_idx);
      const current = decisions[idx] || {};
      if (current.action === "skip") {
        delete decisions[idx];
      } else {
        decisions[idx] = {
          idx: Number(row._compare_idx),
          record_key: row.record_key || "",
          action: "skip",
          reason: "放弃本轮裁决，保留原基线",
          decided_at: new Date().toISOString(),
        };
      }
      writeCompareDecisions(data, decisions);
      renderCompareResult(data);

    async function submitBaselineUpdate(data) {
      const rows = prepareCompareRows(data.records || []);
      const decisions = readCompareDecisions(data);
      const decisionRows = rows.filter((row) => rowDecisionRequiredCount(row) > 0 || decisions[String(row._compare_idx)]);
      const doneRows = decisionRows.filter((row) => {
        const required = rowDecisionRequiredCount(row);
        if (!required) return !!decisions[String(row._compare_idx)];
        return rowDecisionResolvedCount(row, decisions[String(row._compare_idx)]) >= required;
      });
      const pendingRows = Math.max(0, decisionRows.length - doneRows.length);
      if (!decisionRows.length) {
        alert("本次比对没有需要人工裁决的业务差异，无需生成新的业务基线版本。");
        return;
      }
      if (!doneRows.length) {
        alert("当前没有已裁决记录可提交。可以进入详情页裁决，也可以在列表页点击“待裁决”将该条标为放弃裁决。");
        return;
      }
      if (pendingRows > 0 && !window.confirm(`还有 ${pendingRows} 条记录未裁决。本次只提交 ${doneRows.length} 条已裁决记录，其余记录保留原基线，继续吗？`)) return;
      const defaultName = `${(data.baseline && (data.baseline.name || data.baseline.id)) || "真实基线"} / 裁决更新`;
      const nextName = window.prompt("确认提交全部裁决并生成新的 active golden 基线。请输入新基线名称：", defaultName);
      if (nextName === null) return;
      const baselineName = String(nextName || "").trim();
      if (!baselineName) {
        alert("新基线名称不能为空。");
        return;
      }
      const payloadDecisions = doneRows.map((row) => ({
        ...(decisions[String(row._compare_idx)] || {}),
        idx: Number(row._compare_idx),
        record_key: row.record_key || "",
      }));
      const btn = compareResult.querySelector("#submitBaselineUpdate");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "提交中...";
      }
      try {
        const baselineId = compareDataBaselineId(data);
        const taskId = compareDataTaskId(data);
        const res = await fetch(`/api/baselines/${encodeURIComponent(baselineId)}/apply-compare`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            task_id: taskId,
            type: "golden",
            name: baselineName,
            notes: "基线比对裁决更新",
            decisions: payloadDecisions,
          }),
        });
        const result = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(result.detail || "提交基线更新失败");
        clearCompareDecisions(data);
        sessionStorage.removeItem(COMPARE_STATE_KEY);
        const nextId = result.baseline && result.baseline.id;
        alert(`已生成新的真实基线：${(result.baseline && result.baseline.name) || nextId}`);
        if (nextId) location.href = `/baselines?id=${encodeURIComponent(nextId)}`;
      } catch (err) {
        alert(err.message || String(err));
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "提交基线更新";
        }
      }
    }

    function renderCompareResult(data) {
      lastCompareData = data;
      const s = data.summary || {};
      const rows = prepareCompareRows(data.records || []);
      const decisions = readCompareDecisions(data);
      const baseRows = hasCompareDetailFilters() ? rows : compareRowsByFilter(rows, compareFilter);
      const detailRows = applyCompareDetailFilters(baseRows);
      compareHeaderBaseRows = detailRows;
      const aggregateScopeRows = applyCompareColumnFilters(applyCompareDetailFilters(rows), decisions);
      const filteredRows = sortCompareRows(applyCompareColumnFilters(detailRows, decisions), decisions);
      const displayRows = filteredRows.slice(0, 800);
      saveCompareState(data, filteredRows);
      compareResult.innerHTML = `
        ${renderCompareFilters(s, aggregateScopeRows)}
        ${renderCompareDetailFilters()}
        ${compareColumnFilterSummary()}
        ${renderDecisionBar(data, rows)}
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                ${renderCompareHeaderCell("status")}
                ${renderCompareHeaderCell("severity")}
                ${renderCompareHeaderCell("record_id")}
                ${renderCompareHeaderCell("name")}
                ${renderCompareHeaderCell("masked_id")}
                ${renderCompareHeaderCell("capture")}
                ${renderCompareHeaderCell("related_count")}
                ${renderCompareHeaderCell("employment_count")}
                ${renderCompareHeaderCell("shareholding_count")}
                ${renderCompareHeaderCell("basic")}
                ${renderCompareHeaderCell("employment")}
                ${renderCompareHeaderCell("image")}
                ${renderCompareHeaderCell("decision")}
                <th class="right">操作</th>
              </tr>
            </thead>
            <tbody>
              ${displayRows.length ? displayRows.map((row, pos) => `
                <tr>
                  <td><span class="diff-status ${esc(recordStatusClass(row))}">${esc(recordStatusLabel(row))}</span></td>
                  <td><span class="diff-status ${esc(row.severity || "info")}">${esc(severityLabel(row.severity))}</span></td>
                  <td class="mono">${esc(recordId(row))}</td>
                  <td><strong>${esc(recordName(row))}</strong></td>
                  <td>${esc(recordMaskedId(row))}</td>
                  <td>${esc(recordCapture(row))}</td>
                  <td class="mono">${esc(recordCountValue(row, "related_count"))}</td>
                  <td class="mono">${esc(recordCountValue(row, "employment_count"))}</td>
                  <td class="mono">${esc(recordCountValue(row, "shareholding_count"))}</td>
                  <td><div class="diff-chips">${renderBasicDiffChips(row)}</div></td>
                  <td><div class="diff-chips">${renderEmploymentSummaryChips(row)}</div></td>
                  <td><div class="diff-chips">${renderImageDiffChips(row)}</div></td>
                  <td>${
                    rowNeedsDecision(row)
                      ? rowDecisionDone(row, decisions)
                        ? `<span class="decision-chip done">${esc(decisionLabel(decisions[String(row._compare_idx)]) || "已裁决")}</span>`
                        : `<button class="decision-chip need" type="button" data-skip-decision="${esc(String(row._compare_idx))}" title="点击标为放弃裁决，提交时保留原基线">待裁决</button>`
                      : `<span class="decision-chip done">无需</span>`
                  }</td>
                  <td class="right"><a class="btn" href="${esc(compareDetailUrl(row, data, pos))}">详情</a></td>
                </tr>
              `).join("") : `<tr><td colspan="14"><div class="empty">当前筛选条件下没有差异记录。</div></td></tr>`}
            </tbody>
          </table>
        </div>
        <div class="compare-note">
          当前展示：${esc(compareFilterLabel(s))}，筛选后 ${filteredRows.length} 条。
          ${filteredRows.length > 800 ? "列表仅展示前 800 条。" : ""}
          详情页只比较共识后的结构化结果，图片仅作为核验预览。
        </div>
      `;
      bindCompareHeaderInteractions(decisions);
      const submit = compareResult.querySelector("#submitBaselineUpdate");
      submit && submit.addEventListener("click", () => submitBaselineUpdate(data));
      compareResult.querySelectorAll("[data-skip-decision]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = rows.find((row) => String(row._compare_idx) === String(btn.dataset.skipDecision));
          if (target) skipCompareDecision(data, target);
        });
      });
      compareResult.querySelectorAll("[data-compare-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const next = btn.dataset.compareFilter || "review";
          compareFilter = compareFilter === next ? "all" : next;
          renderCompareResult(lastCompareData);
        });
      });
      const search = compareResult.querySelector("#compareSearch");
      search && search.addEventListener("input", () => {
        compareDetailFilters.q = search.value || "";
        shouldFocusCompareSearch = true;
        clearTimeout(compareSearchTimer);
        compareSearchTimer = setTimeout(() => renderCompareResult(lastCompareData), 120);
      });
      search && search.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") renderCompareResult(lastCompareData);
      });
      if (shouldFocusCompareSearch) {
        const focusedSearch = compareResult.querySelector("#compareSearch");
        if (focusedSearch) {
          focusedSearch.focus();
          focusedSearch.setSelectionRange(focusedSearch.value.length, focusedSearch.value.length);
        }
        shouldFocusCompareSearch = false;
      }
      const apply = compareResult.querySelector("#compareApplyFilters");
      apply && apply.addEventListener("click", () => renderCompareResult(lastCompareData));
      const business = compareResult.querySelector("#compareBusinessFilter");
      business && business.addEventListener("change", () => {
        compareDetailFilters.business = business.value || "";
        renderCompareResult(lastCompareData);
      });
      const capture = compareResult.querySelector("#compareCaptureFilter");
      capture && capture.addEventListener("change", () => {
        compareDetailFilters.capture = capture.value || "";
        renderCompareResult(lastCompareData);
      });
      const employment = compareResult.querySelector("#compareEmploymentFilter");
      employment && employment.addEventListener("change", () => {
        compareDetailFilters.employment = employment.value || "";
        renderCompareResult(lastCompareData);
      });
      const severity = compareResult.querySelector("#compareSeverityFilter");
      severity && severity.addEventListener("change", () => {
        compareDetailFilters.severity = severity.value || "";
        renderCompareResult(lastCompareData);
      });
      const decision = compareResult.querySelector("#compareDecisionFilter");
      decision && decision.addEventListener("change", () => {
        compareDetailFilters.decision = decision.value || "";
        renderCompareResult(lastCompareData);
      });
      const reviewOnly = compareResult.querySelector("#compareReviewOnly");
      reviewOnly && reviewOnly.addEventListener("change", () => {
        compareDetailFilters.reviewOnly = !!reviewOnly.checked;
        renderCompareResult(lastCompareData);
      });
      const clear = compareResult.querySelector("#compareClearFilters");
      clear && clear.addEventListener("click", () => {
        compareDetailFilters = { q: "" };
        compareColumnFilters = {};
        compareColumnSort = { key: "", direction: "asc" };
        renderCompareResult(lastCompareData);
      });
    }

    async function startCompare() {
      const baselineId = compareBaseline.value;
      const taskId = compareTask.value;
      if (!baselineId || !taskId) {
        alert("请先选择基线和已完成任务。");
        return;
      }
      compareBtn.disabled = true;
      compareBtn.textContent = "比对中...";
      compareResult.innerHTML = `<div class="empty">正在生成差异结果...</div>`;
      try {
        const res = await fetch("/api/compare", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ baseline_id: baselineId, task_id: taskId }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "比对失败");
        compareFilter = "review";
        compareDetailFilters = { q: "" };
        compareColumnFilters = {};
        compareColumnSort = { key: "", direction: "asc" };
        renderCompareResult(data);
      } catch (err) {
        compareResult.innerHTML = `<div class="empty">${esc(err.message || String(err))}</div>`;
      } finally {
        compareBtn.disabled = false;
        compareBtn.textContent = "开始比对";
      }
    }

    async function loadDetail(id) {
      detail.innerHTML = `<div class="empty">正在加载基线详情...</div>`;
      const res = await fetch(`/api/baselines/${encodeURIComponent(id)}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        detail.innerHTML = `<div class="empty">${esc(data.detail || "加载失败")}</div>`;
        return;
      }
      renderDetail(data);
      const url = new URL(location.href);
      url.searchParams.set("id", id);
      history.replaceState(null, "", url);
    }

    async function refresh() {
      const [baselineRes, taskRes] = await Promise.all([fetch("/api/baselines"), fetch("/api/tasks")]);
      const data = await baselineRes.json().catch(() => ({}));
      const taskData = await taskRes.json().catch(() => ({}));
      if (!baselineRes.ok) {
        list.innerHTML = `<div class="empty">${esc(data.detail || "加载失败")}</div>`;
        return;
      }
      baselines = data.baselines || [];
      tasks = taskData.tasks || [];
      renderCompareControls();
      const targetId = new URL(location.href).searchParams.get("id");
      if (targetId && baselines.some((b) => b.id === targetId)) {
        compareBaseline.value = targetId;
      }
      renderList();
      restoreCompareStateIfNeeded();
    }

    compareBtn.addEventListener("click", startCompare);
    swapCompareBtn.addEventListener("click", swapCompareSources);
    compareBaseline.addEventListener("change", () => selectBaselineForCompare(compareBaseline.value));
    refresh();
  </script>
</body>
</html>
