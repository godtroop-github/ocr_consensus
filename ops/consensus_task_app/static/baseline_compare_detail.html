<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>基线差异详情</title>
  <style>
    @font-face { font-family: "OCRSansSC"; src: url("/assets/fonts/SourceHanSansSC-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: swap; }
    :root {
      --bg: #F8F6F0;
      --paper: #FFFDF8;
      --paper-strong: #fff;
      --line: #E6E0D4;
      --line-soft: #EEE8DC;
      --text: #2F2A24;
      --muted: #7B746A;
      --primary: #7F9D8C;
      --primary-strong: #5E7668;
      --primary-soft: #E7F0EA;
      --ok: #4F7A5F;
      --bad: #B46458;
      --warn: #9A7A3F;
      --danger-bg: #F8E7E3;
      --warning-bg: #F9F0D8;
      --success-bg: #E8F3EC;
      --shadow: 0 10px 32px rgba(62, 54, 43, .055);
      --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: var(--font-ui);
      font-variant-numeric: tabular-nums;
      background:
        radial-gradient(circle at 8% 4%, rgba(221,235,226,.66), transparent 270px),
        radial-gradient(circle at 92% 0%, rgba(216,185,154,.18), transparent 260px),
        linear-gradient(180deg, rgba(255,253,248,.84), rgba(248,246,240,.98)),
        var(--bg);
    }
    .container { width: min(1540px, calc(100vw - 36px)); margin: 0 auto; padding: 22px 0 40px; }
    .head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 23px; font-weight: 560; letter-spacing: -.2px; }
    .sub { margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: #5F574E;
      padding: 7px 12px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 760;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--primary); background: var(--primary-soft); color: var(--text); }
    .btn:disabled { opacity: .42; cursor: not-allowed; }
    .bar {
      position: sticky;
      top: 8px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      background: rgba(255,253,248,.90);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .chip { display: inline-flex; align-items: center; border: 1px solid var(--line-soft); border-radius: 999px; background: var(--paper); color: var(--muted); padding: 4px 9px; font-size: 12px; white-space: nowrap; }
    .chip.ok { color: var(--ok); background: var(--success-bg); }
    .chip.warn { color: var(--warn); background: var(--warning-bg); }
    .chip.bad { color: var(--bad); background: var(--danger-bg); }
    .layout { min-height: max(560px, calc(100svh - 154px)); display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(520px, .96fr); gap: 14px; align-items: stretch; }
    .data-stack { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 14px; min-width: 0; }
    .image-rail { position: sticky; top: 76px; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; min-width: 0; align-self: stretch; }
    .panel { border: 1px solid var(--line); border-radius: 18px; background: rgba(255,253,248,.94); overflow: hidden; box-shadow: var(--shadow); }
    .employment-panel { min-height: 0; display: flex; flex-direction: column; }
    .employment-panel .company-list { flex: 1; overflow: auto; }
    .employment-panel > .empty { flex: 1; min-height: 180px; display: grid; place-items: center; }
    .panel h2 { margin: 0; padding: 11px 14px; border-bottom: 1px solid var(--line-soft); background: rgba(243,240,232,.50); font-size: 14px; font-weight: 720; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 11px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
    th { color: var(--muted); background: rgba(243,240,232,.55); font-size: 12px; font-weight: 820; white-space: nowrap; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); font-size: 12px; }
    .compare-cell { display: grid; grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr); gap: 7px; align-items: stretch; min-width: 280px; }
    .box { border: 1px solid var(--line-soft); border-radius: 10px; padding: 7px 8px; background: var(--paper); overflow-wrap: anywhere; min-height: 34px; }
    .compare-cell.changed .box.base { background: #FFF8E9; border-color: #E9D9B8; }
    .compare-cell.changed .box.curr { background: #FFF1EE; border-color: #EAC8C1; }
    .compare-cell.same .box { background: #F4FAF6; border-color: #CFE3D6; }
    button.value-box { width: 100%; text-align: left; font: inherit; cursor: pointer; }
    .decision-choice { position: relative; transition: border-color .16s ease, background .16s ease, box-shadow .16s ease; }
    .decision-choice.active { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 2px rgba(127,157,140,.28); }
    .decision-choice.active::after { content: "已选"; position: absolute; right: 7px; top: 6px; color: var(--primary-strong); font-size: 10px; font-weight: 900; }
    .field-decision-tools { display: inline-flex; gap: 5px; align-items: center; margin-left: 6px; vertical-align: middle; }
    .decision-mini { border: 1px solid #D8DED4; background: #fff; color: var(--muted); border-radius: 999px; padding: 4px 8px; font-size: 11px; font-weight: 900; cursor: pointer; }
    .decision-mini.active { border-color: #BFD8CA; background: var(--primary-soft); color: var(--primary-strong); }
    .value-box { border: 1px solid var(--line-soft); border-radius: 10px; padding: 7px 8px; background: var(--paper); overflow-wrap: anywhere; min-height: 34px; font-weight: 760; }
    .value-box.base { background: #FFF8E9; border-color: #E9D9B8; }
    .value-box.curr { background: #F4FAF6; border-color: #CFE3D6; }
    .value-box.changed { background: #FFF1EE; border-color: #EAC8C1; }
    .arr { color: var(--muted); display: grid; place-items: center; }
    .diff-status { display: inline-flex; align-items: center; border: 1px solid var(--line-soft); border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 820; white-space: nowrap; }
    .diff-status.same, .diff-status.ok { color: var(--ok); background: var(--success-bg); border-color: #CFE3D6; }
    .diff-status.changed, .diff-status.warn { color: var(--warn); background: var(--warning-bg); border-color: #E9D9B8; }
    .diff-status.bad, .diff-status.high, .diff-status.critical { color: var(--bad); background: var(--danger-bg); border-color: #EAC8C1; }
    .company-list { display: grid; gap: 10px; padding: 12px; }
    details.company { border: 1px solid var(--line-soft); border-radius: 15px; background: var(--paper); overflow: hidden; }
    details.company[open] { background: #fff; border-color: #D9D0C1; }
    summary.company-head { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; }
    summary.company-head::-webkit-details-marker { display: none; }
    .company-pair { display: grid; grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr); gap: 8px; align-items: center; }
    .company-name { font-weight: 760; overflow-wrap: anywhere; }
    .company-name small { display: block; color: var(--muted); font-weight: 420; margin-top: 3px; }
    .company-fields { padding: 0 12px 12px; }
    .company-fields table { border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; background: #fff; }
    .image-panel { min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,253,248,.94); overflow: hidden; box-shadow: var(--shadow); }
    .image-panel h2 { margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); background: rgba(243,240,232,.50); font-size: 13px; font-weight: 720; overflow-wrap: anywhere; }
    .image-frame { flex: 1; min-height: 320px; display: grid; place-items: start center; background: #F2EFE7; overflow: auto; }
    .image-frame img { width: 100%; height: 100%; object-fit: contain; object-position: center top; cursor: zoom-in; }
    .image-frame img.zoomed { width: auto; height: auto; max-width: 100%; max-height: none; cursor: zoom-out; }
    .image-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line-soft); background: var(--paper); }
    .icon { width: 28px; height: 28px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; color: var(--primary-strong); font-weight: 900; }
    .icon:disabled { opacity: .35; cursor: not-allowed; }
    .source-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .source-badge { display: inline-flex; align-items: center; max-width: 100%; padding: 3px 7px; border: 1px solid var(--line-soft); border-radius: 999px; background: #FFFDF8; color: var(--muted); font-size: 11px; font-weight: 680; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty { padding: 30px; text-align: center; color: var(--muted); }
    .note { padding: 10px 12px; color: var(--muted); font-size: 12px; line-height: 1.55; border-top: 1px solid var(--line-soft); background: rgba(255,253,248,.70); }
    .decision-panel { padding: 12px; display: grid; gap: 10px; }
    .decision-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .decision-textarea { width: 100%; min-height: 92px; resize: vertical; border: 1px solid var(--line); border-radius: 14px; background: #FFFDF8; color: var(--text); padding: 10px 12px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; outline: none; }
    .decision-status { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .decision-table-wrap { max-height: 300px; overflow: auto; border: 1px solid var(--line-soft); border-radius: 14px; background: #fff; }
    .panel h2.with-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .section-actions { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .section-actions button { border: 1px solid #D8DED4; background: #FFFFFF; color: var(--muted); border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 900; cursor: pointer; }
    .section-actions button:hover { color: var(--primary-strong); border-color: #BFD8CA; background: var(--primary-soft); }
    .decision-control { min-width: 0; }
    .decision-buttons { display: flex; gap: 5px; flex-wrap: nowrap; }
    .decision-btn { border: 1px solid #D8DED4; background: #FFFFFF; color: var(--muted); border-radius: 999px; padding: 5px 8px; font-size: 11px; font-weight: 900; line-height: 1; cursor: pointer; }
    .decision-btn.active { color: var(--primary-strong); background: var(--primary-soft); border-color: #BFD8CA; }
    .decision-btn:hover { color: var(--primary-strong); border-color: #BFD8CA; }
    .decision-select, .decision-input { width: 100%; border: 1px solid var(--line); border-radius: 999px; background: #FFFDF8; color: var(--text); padding: 7px 9px; font: inherit; font-size: 12px; outline: none; }
    .decision-input { border-radius: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (max-width: 1120px) {
      .layout { grid-template-columns: 1fr; }
      .image-rail { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .image-frame { min-height: 300px; }
    }
    @media (max-width: 760px) {
      .container { width: min(100vw - 24px, 760px); }
      .head { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; }
      .bar { position: static; flex-direction: column; align-items: flex-start; }
      .review-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .image-rail { grid-template-columns: 1fr; }
      .compare-cell, .company-pair { grid-template-columns: 1fr; }
      .arr { display: none; }
      table { min-width: 680px; }
      .panel { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="head">
      <div>
        <h1 id="title">基线差异详情</h1>
        <div id="subtitle" class="sub">加载中...</div>
      </div>
      <div class="actions">
        <a id="backLink" class="btn" href="/baselines">返回比对列表</a>
      </div>
    </div>
    <div class="bar">
      <div id="context" class="chips"></div>
      <div class="actions">
        <button id="prevBtn" class="btn" type="button">上一条</button>
        <button id="nextBtn" class="btn" type="button">下一条</button>
      </div>
    </div>
    <main id="app"><div class="empty">正在加载比对详情...</div></main>
  </div>

  <script>
    const COMPARE_STATE_KEY = "ocr_baseline_compare_state_v2";
    const COMPARE_DECISIONS_KEY = "ocr_baseline_compare_decisions_v1";
    const params = new URLSearchParams(location.search);
    const baselineId = params.get("baseline_id") || "";
    const taskId = params.get("task_id") || "";
    let idx = Number(params.get("idx") || 0);
    let pos = Number(params.get("pos") || -1);
    let compareData = null;
    let filteredIndexes = [];
    let row = null;
    let imageIndex = { baseline: 0, current: 0 };
    let imageZoomed = { baseline: false, current: false };

    const $ = (id) => document.getElementById(id);
    function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
    function chip(text, cls = "") { return `<span class="chip ${cls}">${esc(text)}</span>`; }
    function severityLabel(v) { return ({ info: "提示", low: "低", medium: "中", high: "高", critical: "极高" }[v] || v || "—"); }
    function statusLabel(r) { if (r.match_status === "unmatched_new") return "新增"; if (r.match_status === "unmatched_missing") return "减少"; if (r.requires_review) return "待复核"; return "正常"; }
    function statusClass(r) { if (r.requires_review) return "bad"; if (["newer", "older", "changed", "missing", "filled", "invalid", "missing_current"].includes(r.capture_time_diff_status)) return "warn"; return "ok"; }
    function rec(side) { return (row && row[side]) || {}; }
    function recordName() { return rec("current").person_name || rec("baseline").person_name || "—"; }
    function recordId() { return rec("current").file_id || rec("baseline").file_id || "—"; }
    function recordMaskedId() { return rec("current").masked_id || rec("baseline").masked_id || "—"; }
    function recordCapture(r) { return [r.capture_date, r.capture_time].filter(Boolean).join(" ") || "—"; }
    function countsText(r) { return `${r.related_count || "0"} / ${r.employment_count || "0"} / ${r.shareholding_count || "0"}`; }

    function readCompareState() {
      try { return JSON.parse(sessionStorage.getItem(COMPARE_STATE_KEY) || "null"); } catch (err) { return null; }
    }
    function decisionScope() {
      return `${baselineId}::${taskId}`;
    }
    function readCompareDecisions() {
      try {
        const all = JSON.parse(sessionStorage.getItem(COMPARE_DECISIONS_KEY) || "{}");
        return all[decisionScope()] || {};
      } catch (err) {
        return {};
      }
    }
    function writeCompareDecision(decision) {
      try {
        const all = JSON.parse(sessionStorage.getItem(COMPARE_DECISIONS_KEY) || "{}");
        const scoped = all[decisionScope()] || {};
        scoped[String(idx)] = decision;
        all[decisionScope()] = scoped;
        sessionStorage.setItem(COMPARE_DECISIONS_KEY, JSON.stringify(all));
      } catch (err) {
        throw new Error("浏览器无法保存本轮裁决状态");
      }
    }
    function stateMatches(state) {
      return !!(
        state
        && String(state.baseline_id || "") === String(baselineId || "")
        && String(state.task_id || "") === String(taskId || "")
        && state.compareData
        && Array.isArray(state.compareData.records)
      );
    }
    function normalizeIndexes(records, indexes) {
      const all = records.map((_, i) => i);
      const valid = (indexes || []).map(Number).filter((n) => Number.isFinite(n) && n >= 0 && n < records.length);
      return valid.length ? valid : all;
    }
    function setRowFromPosition() {
      const records = compareData.records || [];
      filteredIndexes = normalizeIndexes(records, filteredIndexes);
      if (pos >= 0 && pos < filteredIndexes.length) {
        idx = filteredIndexes[pos];
      } else {
        idx = Math.max(0, Math.min(idx, records.length - 1));
        pos = filteredIndexes.indexOf(idx);
        if (pos < 0) {
          pos = 0;
          idx = filteredIndexes[0] ?? idx;
        }
      }
      row = records[idx];
    }
    function backHref() {
      const query = new URLSearchParams({ id: baselineId, restore: "1" });
      return `/baselines?${query.toString()}`;
    }
    function detailHref(nextPos) {
      const nextIdx = filteredIndexes[nextPos];
      const query = new URLSearchParams({ baseline_id: baselineId, task_id: taskId, idx: String(nextIdx), pos: String(nextPos) });
      return `/static/baseline_compare_detail.html?${query.toString()}`;
    }

    function imageList(side) {
      const r = rec(side);
      return [...new Set([...(row[`${side}_images`] || []), r.file_name].filter(Boolean))];
    }
    function imageUrl(side, file) {
      const sourceTask = side === "baseline" ? (compareData.baseline && compareData.baseline.source_task_id) : (compareData.task && compareData.task.id);
      return sourceTask && file ? `/runs/${encodeURIComponent(sourceTask)}/dashboard/images/${encodeURIComponent(file)}` : "";
    }
    function imagePanel(side, label) {
      const list = imageList(side);
      const total = list.length;
      const cur = Math.max(0, Math.min(imageIndex[side] || 0, Math.max(0, total - 1)));
      const file = total ? list[cur] : "";
      const src = imageUrl(side, file);
      const zoomClass = imageZoomed[side] ? "zoomed" : "";
      return `
        <section class="image-panel">
          <h2>${esc(label)}${file ? ` · ${esc(file)}` : ""}</h2>
          <div class="image-frame">
            ${src ? `<img class="${zoomClass}" src="${esc(src)}" alt="${esc(label)}" data-zoom-side="${esc(side)}" />` : `<div class="empty">图片不可用</div>`}
          </div>
          <div class="image-tools">
            <button class="icon" data-img-side="${esc(side)}" data-delta="-1" ${total <= 1 ? "disabled" : ""}>‹</button>
            <span class="mono">${total ? `${cur + 1} / ${total}` : "0 / 0"}</span>
            <button class="icon" data-img-side="${esc(side)}" data-delta="1" ${total <= 1 ? "disabled" : ""}>›</button>
          </div>
        </section>
      `;
    }

    function compareCell(a, b) {
      const av = a === undefined || a === null || a === "" ? "—" : a;
      const bv = b === undefined || b === null || b === "" ? "—" : b;
      const same = String(av) === String(bv);
      return `<div class="compare-cell ${same ? "same" : "changed"}"><div class="box base">${esc(av)}</div><div class="arr">→</div><div class="box curr">${esc(bv)}</div></div>`;
    }
    function valueCell(value, side, changed = false) {
      const v = value === undefined || value === null || value === "" ? "—" : value;
      return `<div class="value-box ${esc(side)} ${changed ? "changed" : ""}">${esc(v)}</div>`;
    }
    function decisionValueCell(value, side, changed, decisionMeta, action, selected) {
      if (!decisionMeta) return valueCell(value, side, changed);
      const v = value === undefined || value === null || value === "" ? "—" : value;
      return `<button type="button" class="value-box ${esc(side)} ${changed ? "changed" : ""} decision-choice ${selected === action ? "active" : ""}" data-decision-action="${esc(action)}">${esc(v)}</button>`;
    }
    function fieldDecisionCell(name, decisionMeta, selected) {
      if (!decisionMeta || decisionMeta.allowManual === false) return esc(name);
      return esc(name);
    }
    function statusDecisionCell(statusHtml, decisionMeta, selected) {
      if (!decisionMeta || decisionMeta.allowManual === false) return statusHtml;
      const saved = currentDecision(decisionMeta.kind, decisionMeta.key);
      return `
        <div class="field-decision-tools">
          ${statusHtml}
          <button type="button" class="decision-mini ${selected === "manual" ? "active" : ""}" data-decision-action="manual" title="手工修正">✎</button>
          <input class="decision-input" data-decision-manual="${esc(decisionMeta.kind)}:${esc(decisionMeta.key)}" value="${esc(saved.value || "")}" placeholder="手工值" style="display:${selected === "manual" ? "inline-block" : "none"}; width:120px;" />
        </div>
      `;
    }
    function statusPill(a, b, kind = "") {
      const same = String(a || "") === String(b || "");
      if (kind === "capture") {
        return same
          ? `<span class="diff-status changed">疑点</span>`
          : `<span class="diff-status same">合理</span>`;
      }
      return `<span class="diff-status ${same ? "same" : "changed"}">${same ? "一致" : "变化"}</span>`;
    }
    function currentDecision(kind, key) {
      const existing = readCompareDecisions()[String(idx)] || {};
      if (kind === "basic") return (existing.basic || {})[key] || {};
      if (kind === "employment_field") return (existing.employment || {})[key] || {};
      if (kind === "employment_company") return (existing.employment_companies || {})[key] || {};
      return {};
    }
    function inlineDecisionControl(kind, key, allowManual = true) {
      const saved = currentDecision(kind, key);
      const selected = saved.action || "";
      const scope = kind === "basic" ? "basic" : "employment";
      const actions = kind === "employment_company"
        ? [["keep_baseline", "基线"], ["accept_current", "本次"]]
        : [["keep_baseline", "基线"], ["accept_current", "本次"], ...(allowManual ? [["manual", "手工"]] : [])];
      return `
        <div class="decision-control" data-decision-kind="${esc(kind)}" data-decision-key="${esc(key)}" data-decision-scope="${esc(scope)}" data-selected-action="${esc(selected)}">
          <div class="decision-buttons">
            ${actions.map(([action, label]) => `<button type="button" class="decision-btn ${selected === action ? "active" : ""}" data-decision-action="${esc(action)}">${esc(label)}</button>`).join("")}
          </div>

      if (a.includes(b) || b.includes(a)) return Math.min(a.length, b.length) >= 6;

      const total = filteredIndexes.length || (compareData.records || []).length;
      $("title").textContent = `${recordId()} · ${recordName()}`;
      $("subtitle").textContent = `${compareData.baseline.name || compareData.baseline.id}  对比  ${compareData.task.name || compareData.task.id}`;
      $("context").innerHTML = [
        chip(statusLabel(row), statusClass(row)),
        chip(`风险：${severityLabel(row.severity)}`),
        chip(`筛选集 ${pos + 1} / ${total}`),
        chip(`全量 #${idx + 1} / ${(compareData.records || []).length}`),
        chip(`匹配：${row.match_status || "—"}`),
      ].join("");
      $("backLink").href = backHref();
      $("prevBtn").disabled = pos <= 0;
      $("nextBtn").disabled = pos >= total - 1;
      $("app").innerHTML = `
        <div class="layout">
          <div class="data-stack">
            ${basicSection()}
            ${employmentSection()}
            ${decisionSection()}
          </div>
          <aside class="image-rail">
            ${imagePanel("baseline", "基线图片")}
            ${imagePanel("current", "本次图片")}
          </aside>
        </div>
      `;
      document.querySelectorAll("[data-img-side]").forEach(btn => btn.onclick = () => {
        const side = btn.dataset.imgSide;
        const totalImages = imageList(side).length;
        if (totalImages <= 1) return;
        imageIndex[side] = (Number(imageIndex[side] || 0) + Number(btn.dataset.delta || 0) + totalImages) % totalImages;
        render();
      });
      document.querySelectorAll("[data-zoom-side]").forEach(img => img.onclick = () => {
        const side = img.dataset.zoomSide;
        imageZoomed[side] = !imageZoomed[side];
        img.classList.toggle("zoomed", imageZoomed[side]);
      });
      mountTopDecisionActions();
      document.querySelectorAll("[data-baseline-decision]").forEach(btn => btn.onclick = () => applyBaselineDecision(btn.dataset.baselineDecision));
      document.querySelectorAll("[data-decision-action]").forEach(btn => btn.onclick = () => selectDecisionControl(btn.closest(".decision-control"), btn.dataset.decisionAction));
      document.querySelectorAll("[data-save-field-decisions]").forEach(btn => btn.onclick = saveFieldDecisions);
      document.querySelectorAll("[data-fill-field-decisions]").forEach(btn => btn.onclick = () => fillFieldDecisions(btn.dataset.fillFieldDecisions, btn.dataset.fillScope || ""));
    }
    async function load() {
      if (!baselineId || !taskId) { $("app").innerHTML = `<div class="empty">缺少 baseline_id 或 task_id。</div>`; return; }
      const state = readCompareState();
      if (stateMatches(state)) {
        compareData = state.compareData;
        filteredIndexes = normalizeIndexes(compareData.records || [], state.filteredIndexes || []);
        setRowFromPosition();
        render();
        return;
      }
      const res = await fetch("/api/compare", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ baseline_id: baselineId, task_id: taskId }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { $("app").innerHTML = `<div class="empty">${esc(data.detail || "加载失败")}</div>`; return; }
      compareData = data;
      filteredIndexes = normalizeIndexes(data.records || [], []);
      setRowFromPosition();
      render();
    }
    $("prevBtn").onclick = () => { if (pos > 0) location.href = detailHref(pos - 1); };
    $("nextBtn").onclick = () => { if (compareData && pos < filteredIndexes.length - 1) location.href = detailHref(pos + 1); };
    load();
  </script>
</body>
</html>
